<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente AI - Supporto IT ADCO HUB</title>
<meta name="description" content="Chiedi in linguaggio naturale all'assistente AI del supporto IT: risponde usando le guide della knowledge base.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-pagina="ai-mode">

<header class="intestazione">
  <div class="contenitore intestazione-riga">
    <a class="logo" href="index.html">
      <img src="assets/img/adc-logo.png" alt="Logo ADC" class="logo-immagine">
      <span class="logo-testo"><strong>Supporto IT</strong><span>ADCO HUB</span></span>
    </a>
    <form class="cerca cerca-compatta" role="search">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
      <input id="campo-ricerca" type="search" placeholder="Cerca una guida..." aria-label="Cerca nella knowledge base">
    </form>
    <button class="menu-toggle" id="menu-toggle" aria-label="Apri il menu">&#9776;</button>
    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="ricerca.html">Cerca</a>
      <a data-voce="contatti" href="contatti.html">Contatti</a>
      <a class="esci" href="/api/logout">Esci</a>
    </nav>
  </div>
</header>

<div class="ai-barra-superiore">
  <div class="contenitore ai-barra-superiore-riga">
    <span class="ai-etichetta"><span class="ai-scintilla">✦</span> AI Mode</span>
    <a class="ai-torna" href="index.html">&larr; Torna alla ricerca classica</a>
  </div>
</div>

<main class="pagina-ai">

  <div class="ai-vuoto" id="ai-vuoto">
    <h1 class="ai-saluto"><span class="ai-scintilla">✦</span> Ciao, cosa hai in mente?</h1>

    <form class="ai-composer" id="modulo-ai" role="search">
      <input
        id="campo-ai-pagina"
        type="search"
        placeholder="Chiedi qualsiasi cosa sul supporto IT..."
        aria-label="Chiedi all'assistente AI"
        autocomplete="off"
        autofocus
      >
      <button type="submit" class="ai-invia" id="ai-invia" aria-label="Invia domanda">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 4 11h5v10h6V11h5L12 3Z"/></svg>
      </button>
    </form>

    <div class="ai-suggerimenti-lista" id="ai-suggerimenti">
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Come%20reimposto%20la%20password%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Come reimposto la password?</span>
      </a>
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Il%20PC%20%C3%A8%20lento%2C%20cosa%20posso%20fare%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Il PC è lento, cosa posso fare?</span>
      </a>
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Come%20richiedo%20l%27installazione%20di%20un%20software%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Come richiedo l'installazione di un software?</span>
      </a>
    </div>
  </div>

  <div class="ai-conversazione" id="conversazione-ai"></div>

</main>

<div class="ai-composer-fissa" id="ai-composer-fissa" hidden>
  <div class="contenitore ai-composer-fissa-interno"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  "use strict";

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }

  function parametroQ() {
    var m = /[?&]q=([^&]*)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }

  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* Formattazione minima: **grassetto** e paragrafi, senza HTML arbitrario. */
  function formattaRisposta(testo) {
    var sicuro = escHtml(testo).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return sicuro
      .split(/\n{2,}/)
      .map(function (blocco) { return "<p>" + blocco.replace(/\n/g, "<br>") + "</p>"; })
      .join("");
  }

  document.addEventListener("DOMContentLoaded", function () {
    var form = $("#modulo-ai");
    var campo = $("#campo-ai-pagina");
    var invia = $("#ai-invia");
    var vuoto = $("#ai-vuoto");
    var conversazione = $("#conversazione-ai");
    var suggerimenti = $("#ai-suggerimenti");
    var composerFissa = $("#ai-composer-fissa");
    var composerFissaInterno = composerFissa ? $(".ai-composer-fissa-interno", composerFissa) : null;

    if (!form || !campo || !conversazione || !composerFissa || !window.KBAiuto) return;

    var inConversazione = false;

    /* La prima domanda sposta il modulo dal centro della schermata
       vuota alla barra fissa in fondo, come nell'AI Mode di Google. */
    function passaAllaConversazione() {
      if (inConversazione) return;
      inConversazione = true;
      vuoto.hidden = true;
      composerFissa.hidden = false;
      composerFissaInterno.appendChild(form);
      campo.placeholder = "Chiedi un'altra cosa...";
    }

    function copiaRisposta(testo, pulsante) {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(testo).then(function () {
        var originale = pulsante.getAttribute("aria-label");
        pulsante.setAttribute("aria-label", "Copiato");
        setTimeout(function () { pulsante.setAttribute("aria-label", originale); }, 1500);
      }).catch(function () {});
    }

    async function chiedi(messaggio) {
      passaAllaConversazione();
      if (suggerimenti) suggerimenti.hidden = true;

      var turno = document.createElement("div");
      turno.className = "ai-turno";
      turno.innerHTML =
        '<div class="ai-domanda">' + escHtml(messaggio) + "</div>" +
        '<div class="risposta-ai risposta-ai-caricamento">Sto preparando la risposta...</div>';
      conversazione.appendChild(turno);
      turno.scrollIntoView({ behavior: "smooth", block: "start" });

      var box = turno.querySelector(".risposta-ai");
      invia.disabled = true;
      campo.disabled = true;

      try {
        var testo = await window.KBAiuto.chiediAI(messaggio);
        var risposta = testo || "Non ho ricevuto una risposta dall'assistente.";

        box.className = "risposta-ai";
        box.innerHTML = formattaRisposta(risposta);

        var disclaimer = document.createElement("p");
        disclaimer.className = "ai-disclaimer";
        disclaimer.innerHTML = "Le risposte dell'assistente possono contenere imprecisioni: per i casi importanti verifica con il <a href=\"contatti.html\">supporto IT</a>.";
        turno.appendChild(disclaimer);

        var azioni = document.createElement("div");
        azioni.className = "ai-risposta-azioni";
        azioni.innerHTML =
          '<button type="button" class="ai-azione" aria-label="Copia risposta">' +
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 3h9a2 2 0 0 1 2 2v12h-2V5H8V3Zm-3 4h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Zm0 2v10h9V9H5Z"/></svg>' +
          "</button>";
        turno.appendChild(azioni);
        azioni.querySelector(".ai-azione").addEventListener("click", function (e) {
          copiaRisposta(risposta, e.currentTarget);
        });

      } catch (errore) {
        box.className = "risposta-ai risposta-ai-errore";
        box.textContent = "Non riesco a contattare l'assistente AI. Riprova tra poco.";
      } finally {
        invia.disabled = false;
        campo.disabled = false;
        campo.focus();
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var messaggio = campo.value.trim();
      if (!messaggio) return;
      campo.value = "";
      chiedi(messaggio);
    });

    var iniziale = parametroQ();
    if (iniziale) chiedi(iniziale);
  });
})();
</script>
</body>
</html>
