<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente AI - Supporto IT ADCO HUB</title>
<meta name="description" content="Chiedi in linguaggio naturale all'assistente AI del supporto IT: risponde usando le guide della knowledge base.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-pagina="ai-mode">

<header class="intestazione">
  <div class="contenitore intestazione-riga">
    <a class="logo" href="index.html">
      <img src="assets/img/adc-logo.png" alt="Logo ADC" class="logo-immagine">
      <span class="logo-testo"><strong>Supporto IT</strong><span>ADCO HUB</span></span>
    </a>
    <form class="cerca cerca-compatta" role="search">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
      <input id="campo-ricerca" type="search" placeholder="Cerca una guida..." aria-label="Cerca nella knowledge base">
    </form>
    <button class="menu-toggle" id="menu-toggle" aria-label="Apri il menu">&#9776;</button>
    <nav class="nav" id="nav">
      <a href="index.html">Home</a>
      <a href="ricerca.html">Cerca</a>
      <a data-voce="contatti" href="contatti.html">Contatti</a>
      <a class="esci" href="/api/logout">Esci</a>
    </nav>
  </div>
</header>

<div class="ai-barra-superiore">
  <div class="contenitore ai-barra-superiore-riga">
    <span class="ai-etichetta"><span class="ai-scintilla">✦</span> AI Mode</span>
    <a class="ai-torna" href="index.html">&larr; Torna alla ricerca classica</a>
  </div>
</div>

<main class="pagina-ai">

  <div class="ai-vuoto" id="ai-vuoto">
    <h1 class="ai-saluto"><span class="ai-scintilla">✦</span> Ciao, cosa hai in mente?</h1>

    <form class="ai-composer" id="modulo-ai" role="search">
      <input
        id="campo-ai-pagina"
        type="search"
        placeholder="Chiedi qualsiasi cosa sul supporto IT..."
        aria-label="Chiedi all'assistente AI"
        autocomplete="off"
        autofocus
      >
      <button type="submit" class="ai-invia" id="ai-invia" aria-label="Invia domanda">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 4 11h5v10h6V11h5L12 3Z"/></svg>
      </button>
    </form>

    <div class="ai-suggerimenti-lista" id="ai-suggerimenti">
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Come%20reimposto%20la%20password%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Come reimposto la password?</span>
      </a>
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Il%20PC%20%C3%A8%20lento%2C%20cosa%20posso%20fare%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Il PC è lento, cosa posso fare?</span>
      </a>
      <a class="ai-suggerimento-riga" href="ai-mode.html?q=Come%20richiedo%20l%27installazione%20di%20un%20software%3F">
        <svg class="ai-suggerimento-icona" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
        <span>Come richiedo l'installazione di un software?</span>
      </a>
    </div>
  </div>

  <div class="ai-conversazione" id="conversazione-ai"></div>

</main>

<div class="ai-composer-fissa" id="ai-composer-fissa" hidden>
  <div class="contenitore ai-composer-fissa-interno"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
